name: validate

# CI validates the spin definition: the kickstart and the shell embedded in
# it, plus the in-place converter (migrate/*) and the shared gates
# files/verify-devstation.sh and scripts/expand-packages.py. The ISOs are
# built on the machine that will install them (see README.md, "Building");
# nothing is published or retained here.

on:
  push:
    branches: [main]
    paths:
      - "kickstart/**"
      - "files/**"
      - "files/verify-devstation.sh"
      - "migrate/**"
      - "repos/**"
      - "scripts/**"
      - "scripts/expand-packages.py"
      - "build.sh"
      - "justfile"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "kickstart/**"
      - "files/**"
      - "files/verify-devstation.sh"
      - "migrate/**"
      - "repos/**"
      - "scripts/**"
      - "scripts/expand-packages.py"
      - "build.sh"
      - "justfile"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install pykickstart
        run: dnf install -y pykickstart
      # python3 powers the converter's py_compile and self-tests; ShellCheck
      # is the Fedora package that provides the `shellcheck` binary. Both are
      # required: a partial install would fail later with a confusing error.
      - name: Install python3 and ShellCheck
        run: dnf install -y python3 ShellCheck
      # bash -n every shell file the converter ships: the entry point, its
      # libraries, the steps and the tests, plus the shared gate. A missing
      # file is a clear failure, not a silent skip.
      - name: Syntax-check converter shell
        run: |
          set -euo pipefail
          for f in migrate/migrate.sh migrate/lib/*.sh migrate/steps/*.sh \
                   migrate/tests/*.sh files/verify-devstation.sh; do
            [ -e "$f" ] || { echo "MISSING: $f" >&2; exit 1; }
            bash -n "$f"
          done
      # The converter manifest generator.
      - name: Compile-check manifest.py
        run: python3 -m py_compile migrate/manifest.py
      # Shellcheck the same files. -s bash covers the sourced libraries and
      # steps, which have no shebang of their own; SC1090/SC1091 are excluded
      # because libraries are sourced through "$REPO_DIR/migrate/lib/<name>.sh"
      # variable paths that shellcheck cannot follow. -S warning keeps purely
      # informational findings (e.g. SC2015 in tests) from failing CI.
      - name: Shellcheck converter scripts
        run: |
          set -euo pipefail
          for f in migrate/migrate.sh migrate/lib/*.sh migrate/steps/*.sh \
                   migrate/tests/*.sh files/verify-devstation.sh; do
            [ -e "$f" ] || { echo "MISSING: $f" >&2; exit 1; }
            shellcheck -s bash -S warning -e SC1090,SC1091 "$f"
          done
      # The converter is self-contained: run its unit tests.
      - name: Run converter self-tests
        run: |
          set -euo pipefail
          for t in migrate/tests/test-state.sh migrate/tests/test-download.sh \
                   migrate/tests/test-rpms.sh migrate/tests/test-manifest.sh \
                   migrate/tests/test-preflight.sh migrate/tests/test-config.sh \
                   migrate/tests/test-flatpak.sh; do
            [ -f "$t" ] || { echo "MISSING: $t" >&2; exit 1; }
            echo "== $t =="
            bash "$t"
          done
      # build.sh check runs ksvalidator and then `bash -n` on every
      # %pre/%post block, which is the part ksvalidator cannot see.
      - name: Validate kickstart
        run: ./build.sh check
